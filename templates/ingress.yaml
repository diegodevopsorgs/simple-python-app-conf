{{- /* Un Ingress por app: cada host recibe los paths de todos los deployments habilitados. */}}
{{- if and .Values.enabled .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range (required "falta 'ingress.hosts' en values-<env>.yaml" .Values.ingress.hosts) }}
    - host: {{ . }}
      http:
        paths:
          {{- range $name, $d := $.Values.deployments }}
          {{- if $d.enabled }}
          {{- range $d.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $d.port }}
          {{- end }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
